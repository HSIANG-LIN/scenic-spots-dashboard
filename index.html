<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景點地圖 Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #1a1a1a;
            --sidebar-bg: #252525;
            --text-color: #e0e0e0;
            --accent-color: #e94560;
            --card-bg: #333;
        }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; }
        #container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 350px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid #444; z-index: 1000; }
        #map { flex-grow: 1; }
        
        .sidebar-header { padding: 20px; border-bottom: 1px solid #444; }
        .sidebar-header h2 { margin: 0 0 15px 0; font-size: 1.5rem; color: var(--accent-color); }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        input, select { 
            padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; width: 100%; box-sizing: border-box;
        }
        
        #spot-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .spot-card { 
            background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: transform 0.2s; 
            border-left: 4px solid var(--accent-color);
        }
        .spot-card:hover { transform: translateX(5px); background: #444; }
        .spot-card h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .spot-card .info { font-size: 0.85rem; color: #bbb; line-height: 1.4; }
        .spot-card .meta { margin-top: 8px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-link { color: #4ecdc4; text-decoration: none; font-weight: bold; }

        .leaflet-popup-content-wrapper { background: var(--card-bg); color: var(--text-color); border-radius: 8px; }
        .leaflet-popup-tip { background: var(--card-bg); }
        .popup-content { max-width: 200px; }
        .popup-content h3 { margin: 0 0 5px 0; color: var(--accent-color); }
        .popup-content p { margin: 5px 0; font-size: 0.9rem; }
        .popup-content .meta { font-size: 0.8rem; color: #aaa; border-top: 1px solid #444; padding-top: 5px; margin-top: 5px; }

        /* Custom Marker Style */
        .custom-marker {
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="sidebar-header">
                <h2>🏔️ 新景點地圖</h2>
            <p style="margin:0;font-size:0.85rem;color:#999" id="sidebar-stats"></p>
            <div class="controls">
                <input type="text" id="search-input" placeholder="搜尋景點名稱...">
                <select id="city-filter">
                    <option value="">全部城市</option>
                </select>
            </div>
        </div>
        <div id="spot-list"></div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, markers = [], spots = [];
    const colors = ['#e94560', '#f5a623', '#4ecdc4', '#6c5ce7', '#2ecc71', '#e67e22', '#3498db'];

    async function init() {
        // Initialize Map
        map = L.map('map').setView([25, 121], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        try {
            const response = await fetch('spots.json');
            spots = await response.json();
        } catch (e) {
            console.error("Failed to load spots.json", e);
            return;
        }

        populateFilters();
        renderMarkers(spots);
        renderList(spots);
        updateStats(spots);
        
        // Initial fitBounds
        if (spots.length > 0) {
            const bounds = L.latLngBounds(spots.map(s => [s.lat, s.lng]));
            map.fitBounds(bounds, { padding: [50, 50] });
        }

        // Events
        document.getElementById('search-input').addEventListener('input', filterSpots);
        document.getElementById('city-filter').addEventListener('change', filterSpots);
    }

    function populateFilters() {
        const cities = [...new Set(spots.map(s => s.city))].sort();
        const filter = document.getElementById('city-filter');
        cities.forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.textContent = city;
            filter.appendChild(opt);
        });
    }

    function renderMarkers(data) {
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        data.forEach((spot, index) => {
            const color = colors[index % colors.length];
            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<span style="color: ${color}">🏔️</span>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);
            
            const popupHtml = `
                <div class="popup-content">
                    <h3>${spot.name}</h3>
                    <p>${spot.address}</p>
                    <p>📅 ${spot.year}</p>
                    <p>${spot.description}</p>
                    <div class="meta">
                        <span>📍 ${spot.source}</span>
                        <a href="https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}" target="_blank" style="color:#4ecdc4">🗺️ 導航</a>
                    </div>
                </div>
            `;
            marker.bindPopup(popupHtml);
            marker.on('click', () => {
                map.setView([spot.lat, spot.lng], 15);
                marker.openPopup();
            });
            markers.push(marker);
            spot.leafletMarker = marker;
        });
    }

    function renderList(data) {
        const list = document.getElementById('spot-list');
        list.innerHTML = '';
        
        data.forEach(spot => {
            const card = document.createElement('div');
            card.className = 'spot-card';
            card.style.borderLeftColor = colors[spots.indexOf(spot) % colors.length];
            card.innerHTML = `
                <h3>${spot.name}</h3>
                <div class="info">${spot.city} | ${spot.year}</div>
                <div class="meta">
                    <span>📍 ${spot.address}</span>
                    <a href="https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}" target="_blank" class="nav-link">🗺️ 導航</a>
                </div>
            `;
            card.onclick = () => {
                map.setView([spot.lat, spot.lng], 15);
                spot.leafletMarker.openPopup();
            };
            list.appendChild(card);
        });
    }

    function filterSpots() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const cityTerm = document.getElementById('city-filter').value;

        const filtered = spots.filter(s => {
            const matchesSearch = s.name.toLowerCase().includes(searchTerm) || s.address.toLowerCase().includes(searchTerm);
            const matchesCity = cityTerm === "" || s.city === cityTerm;
            return matchesSearch && matchesCity;
        });

        renderMarkers(filtered);
        renderList(filtered);
        updateStats(filtered);
    }

    function updateStats(data) {
        const cities = [...new Set(data.map(s => s.city))].sort();
        document.getElementById('sidebar-stats').textContent = `${data.length} 個景點 · ${cities.length} 縣市`;
    }

    init();
</script>

</body>
</html>
